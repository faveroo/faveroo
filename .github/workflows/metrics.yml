name: Update profile metrics

on:
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - .github/workflows/metrics.yml
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: profile-automation
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate metrics and recent work
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_profile.py

      - name: Commit changes when needed
        run: |
          if git diff --quiet; then
            echo "Profile is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/generated/metrics.svg
          git commit -m "chore: update profile metrics"
          git pull --rebase origin main
          git push
