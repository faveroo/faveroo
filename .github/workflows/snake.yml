name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * *"

permissions:
  contents: write

concurrency:
  group: profile-automation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate contribution graph
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: faveroo
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit changes when needed
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo "Contribution graph is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore: update contribution snake"
          git push
