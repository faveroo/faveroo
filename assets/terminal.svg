<svg xmlns="http://www.w3.org/2000/svg" width="820" height="180" viewBox="0 0 820 180" role="img" aria-labelledby="title desc">
  <title id="title">Backend quality terminal panel</title>
  <desc id="desc">A static terminal-inspired panel showing backend quality checks without simulated command input.</desc>

  <rect width="820" height="180" rx="16" fill="#0d1117" stroke="#30363d"/>
  <circle cx="28" cy="27" r="5" fill="#f85149"/>
  <circle cx="46" cy="27" r="5" fill="#d29922"/>
  <circle cx="64" cy="27" r="5" fill="#3fb950"/>

  <text x="92" y="32" fill="#8b949e" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">backend quality pipeline</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">
    <text x="32" y="76" fill="#3fb950">✓ tests</text>
    <text x="182" y="76" fill="#3fb950">✓ static analysis</text>
    <text x="402" y="76" fill="#3fb950">✓ formatting</text>
    <text x="595" y="76" fill="#3fb950">✓ CI</text>
  </g>

  <line x1="32" y1="101" x2="788" y2="101" stroke="#21262d"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
    <text x="32" y="130" fill="#58a6ff">PHP</text>
    <text x="72" y="130" fill="#8b949e">/</text>
    <text x="88" y="130" fill="#ff7b72">Laravel</text>
    <text x="148" y="130" fill="#8b949e">/</text>
    <text x="164" y="130" fill="#d2a8ff">APIs</text>
    <text x="202" y="130" fill="#8b949e">/</text>
    <text x="218" y="130" fill="#a5d6ff">automation</text>
    <text x="304" y="130" fill="#8b949e">/</text>
    <text x="320" y="130" fill="#c9d1d9">clean architecture</text>
  </g>

  <text x="32" y="156" fill="#8b949e" font-size="14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">maintainable software &gt; clever software</text>
</svg>